<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>microdos</title>
  <style>
    body {
      background-color: #0c0d0e;
      color: #e1e4e8;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      box-sizing: border-box;
    }

    .container {
      max-width: 420px;
      width: 100%;
      border: 1px solid #2a2e33;
      padding: 1.75rem;
      border-radius: 6px;
      background-color: #121518;
    }

    h1 {
      margin: 0 0 1.25rem 0;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #58a6ff;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    li {
      margin: 0;
    }

    a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.65rem 0.85rem;
      background: #181c20;
      border: 1px solid #282e34;
      border-radius: 4px;
      color: #f0f6fc;
      text-decoration: none;
      font-size: 0.9rem;
      transition: background 0.15s, border-color 0.15s;
    }

    a:hover {
      background: #21262d;
      border-color: #58a6ff;
    }

    .arrow {
      color: #8b949e;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>microdos</h1>
    <ul>
      <li>
        <a href="microdos_tiny.exe" download="microdos_tiny.exe">
          <span>microdos_tiny.exe</span>
          <span class="arrow">↓</span>
        </a>
      </li>
      <li>
        <a href="microdos.wasm" download="microdos.wasm">
          <span>microdos.wasm</span>
          <span class="arrow">↓</span>
        </a>
      </li>
    </ul>
  </div>
</body>
</html>
